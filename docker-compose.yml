# YITZone Topology A — MVP & Standard Operation (HLD Section 6.1)
# Note: All image tags are pinned per HLD 6.2 (especially pgsty/silo under AGPLv3).

services:
  mongodb:
    image: mongo:8.0.4
    container_name: yitzone-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "2.0"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: yitzone
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    container_name: yitzone-redis
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    container_name: yitzone-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  silo:
    image: pgsty/silo:latest
    container_name: yitzone-silo
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${YITZONE_STORAGE_ACCESS_KEY:-yitzone_dev_key}
      MINIO_ROOT_PASSWORD: ${YITZONE_STORAGE_SECRET_KEY:-yitzone_dev_secret}
    volumes:
      - silo_data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.22.3
    container_name: yitzone-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  yitzone-server:
    build:
      context: ./yitzone-server
      dockerfile: Dockerfile
    container_name: yitzone-server
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/yitzone?replicaSet=rs0
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      YITZONE_STORAGE_ENDPOINT: http://silo:9000
      YITZONE_STORAGE_ACCESS_KEY: ${YITZONE_STORAGE_ACCESS_KEY:-yitzone_dev_key}
      YITZONE_STORAGE_SECRET_KEY: ${YITZONE_STORAGE_SECRET_KEY:-yitzone_dev_secret}
      YITZONE_CLAMAV_ENABLED: ${YITZONE_CLAMAV_ENABLED:-false}
      YITZONE_CLAMAV_HOST: clamav
      YITZONE_CLAMAV_PORT: 3310
      YITZONE_JWT_SECRET: ${YITZONE_JWT_SECRET:?YITZONE_JWT_SECRET is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-https://accounts.google.com}
      YITZONE_PAYMENT_WEBHOOK_SECRET: ${YITZONE_PAYMENT_WEBHOOK_SECRET:?YITZONE_PAYMENT_WEBHOOK_SECRET is required}
      YITZONE_FRONTEND_BASE_URL: ${YITZONE_FRONTEND_BASE_URL:-http://localhost}
      YITZONE_DEV_ADMIN_PASSWORD: ${YITZONE_DEV_ADMIN_PASSWORD:-YitZone@Admin2026!}
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1536m"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  yitzone-client:
    build:
      context: .
      dockerfile: yitzone-client/Dockerfile
    container_name: yitzone-client
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - yitzone-server
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  clamav_data:
  silo_data:
